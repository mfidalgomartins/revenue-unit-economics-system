name: analytics-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: analytics-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, type-check, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy type-check
        run: mypy

      - name: Dependency consistency
        run: pip check

      - name: Dependency audit
        run: pip-audit -r requirements-dev.txt

  validate-and-test:
    name: Pipeline and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run full pipeline
        run: python -m src.run_pipeline

      - name: Verify deterministic published artifacts
        run: |
          git diff --exit-code -- \
            data \
            outputs/tables \
            outputs/governance \
            outputs/dashboard \
            outputs/reports/decision_brief.md \
            outputs/reports/metric_registry.md \
            outputs/reports/qa_report.md \
            outputs/charts/README.md
          test -z "$(git ls-files --others --exclude-standard -- \
            data \
            outputs/tables \
            outputs/governance \
            outputs/dashboard \
            outputs/reports/decision_brief.md \
            outputs/reports/metric_registry.md \
            outputs/reports/qa_report.md \
            outputs/charts/README.md)"

      - name: Run tests with coverage gate
        run: pytest

  postgres-smoke:
    name: PostgreSQL ingestion, dbt, API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: revenue_analytics
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d revenue_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run PostgreSQL integration smoke
        env:
          POSTGRES_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/revenue_analytics
        run: pytest --no-cov tests/test_postgres_integration.py -q
